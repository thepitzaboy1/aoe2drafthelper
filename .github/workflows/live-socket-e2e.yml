name: live-socket-e2e

on:
  push:
    branches: [main]
    paths:
      - live_server.py
      - live_socket_probe.py
      - requirements.txt
      - render.yaml
      - .github/workflows/live-socket-e2e.yml
  workflow_dispatch:

jobs:
  aoe2cm-live-socket:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Probe AoE2CM Socket.IO directly
        run: python live_socket_probe.py
      - name: Wait for Render v3.3 and verify deployed proxy
        env:
          TARGET_URL: https://aoe2-draft-assistant.onrender.com
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          base=os.environ['TARGET_URL'].rstrip('/')
          def get_json(url, timeout=20):
              req=urllib.request.Request(url,headers={'User-Agent':'AoE2DraftAssistant-E2E/3.3','Accept':'application/json','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.status,json.load(r)

          last=None
          for _ in range(90):
              try:
                  status,cfg=get_json(base+'/api/config')
                  last=(status,cfg)
                  if status==200 and float(cfg.get('version',0))>=3.3:
                      break
              except Exception as e:
                  last=repr(e)
              time.sleep(5)
          else:
              raise AssertionError(f'Render v3.3 did not become ready: {last}')

          sample='https://aoe2cm.net/draft/OEoDI'
          status,data=get_json(base+'/api/draft?url='+urllib.parse.quote(sample,safe=''))
          assert status==200 and data.get('ok'), data
          assert len((data.get('data') or {}).get('events',[]))==55, data
          print(json.dumps({'deployedArchivedDraft':'PASS','mode':data.get('mode')}))

          # Exercise a genuinely ongoing public draft when one exists now.
          status,recent=get_json('https://aoe2cm.net/api/recentdrafts')
          ongoing=next((d for d in recent if d.get('ongoing') and d.get('draftId')),None)
          if ongoing:
              live_url='https://aoe2cm.net/draft/'+ongoing['draftId']
              status,live=get_json(base+'/api/draft?url='+urllib.parse.quote(live_url,safe=''),timeout=30)
              assert status==200 and live.get('ok'), live
              assert isinstance((live.get('data') or {}).get('events'),list), live
              print(json.dumps({'deployedOngoingDraft':'PASS','draftId':ongoing['draftId'],'mode':live.get('mode'),'events':len(live['data']['events'])}))
          else:
              print(json.dumps({'deployedOngoingDraft':'SKIP','reason':'no public ongoing draft at test time'}))
          PY
