name: deployed-e2e

on:
  push:
    branches: [main]
    paths:
      - deployed_e2e.mjs
      - .github/workflows/deployed-e2e.yml
  workflow_dispatch:

jobs:
  render-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Wait for Render and run deployed E2E
        env:
          TARGET_URL: https://aoe2-draft-assistant.onrender.com
        run: node deployed_e2e.mjs
