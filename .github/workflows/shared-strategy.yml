name: shared-strategy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  durable-library:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: draft_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Storage, transactions, restart and conflict tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/draft_test
        run: python shared_store_test.py
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test collaboration with isolated browser sessions
        run: node shared_browser_e2e.mjs
