services:
  - type: web
    name: aoe2-draft-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python live_server.py --no-browser
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_DURABLE_STRATEGIES
        value: "1"
